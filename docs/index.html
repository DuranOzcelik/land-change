<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Land Change: how cities have grown since 2016, by satellite</title>
  <link rel="canonical" href="https://greenloss.com/">
  <meta name="description" content="Pick a place on a 3D globe and see how built-up land, farmland and forest changed since 2016, from Sentinel-2 imagery classified by a neural network.">
  <!-- Only this site, the API, the geocoder and the basemap may be contacted. Styles allow inline
       attributes (cell colours); MapLibre runs its worker from a blob. localhost is for local work. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.maps.eox.at; connect-src 'self' data: blob: https://land-change-1098531335280.europe-west1.run.app https://photon.komoot.io https://tiles.maps.eox.at http://localhost:* http://127.0.0.1:*; worker-src blob:; child-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#163300">
  <!-- Link previews do not run scripts, so these stay fixed and in English. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Land Change">
  <meta property="og:title" content="Land Change: how cities have grown since 2016, by satellite">
  <meta property="og:description" content="Pick a place on a 3D globe and see how built-up land, farmland and forest changed since 2016, from Sentinel-2 imagery classified by a neural network.">
  <meta property="og:url" content="https://greenloss.com/">
  <meta property="og:image" content="https://greenloss.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Land Change: a globe covered with land-cover cells">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="map-wrap" id="map-wrap">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="map" aria-label="Globe"></div>
    <div id="map-after" aria-hidden="true" hidden></div>
    <div class="split-handle" id="split-handle" role="slider" tabindex="0"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" hidden>
      <span class="split-line"></span>
      <span class="split-knob"></span>
      <span class="split-tag before" id="split-tag-before"></span>
      <span class="split-tag after" id="split-tag-after"></span>
    </div>
    <ul class="legend" id="legend" hidden></ul>
    <div class="map-year" id="map-year" aria-hidden="true" hidden></div>
  </div>

  <header class="topbar">
    <a class="wordmark" href="./" data-i18n="title">Land Change</a>
    <nav class="section-links" data-i18n-label="exploreLabel">
      <button class="pill-button ghost" type="button" data-scroll="examples" data-i18n="examplesTitle"></button>
      <button class="pill-button ghost" type="button" data-scroll="rankings" data-i18n="rankingsTitle"></button>
      <button class="pill-button ghost" type="button" data-scroll="about" data-i18n="aboutTitle"></button>
    </nav>
    <div class="topbar-tools">
      <label class="visually-hidden" for="lang" data-i18n="language">Language</label>
      <select id="lang" class="pill-select"></select>
      <button id="theme" class="pill-button ghost" type="button"></button>
    </div>
  </header>

  <main class="stage">
    <section class="left">
      <div class="hero" id="hero">
        <h1 data-i18n="hero">How are cities growing?</h1>
        <p data-i18n="heroSub"></p>
      </div>

      <form class="card controls" id="controls" autocomplete="off">
        <div class="search">
          <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" aria-controls="suggestions" aria-autocomplete="list">
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
          <p class="hint" id="place-line" data-i18n="searchHint"></p>
        </div>

        <div class="options" id="options" hidden>
        <div class="segmented" role="tablist" id="mode">
          <button type="button" role="tab" data-mode="now" data-i18n="modeNow" aria-selected="true"></button>
          <button type="button" role="tab" data-mode="change" data-i18n="modeChange" aria-selected="false"></button>
          <button type="button" role="tab" data-mode="time" data-i18n="modeTime" aria-selected="false"></button>
        </div>

        <div class="fields" id="fields-now">
          <div class="field">
            <div class="field-head"><label for="when" data-i18n="when"></label>
              <button type="button" class="text-button" data-dates="when" aria-expanded="false" aria-controls="dates-when" data-i18n="datesButton"></button></div>
            <input id="when" type="text" inputmode="numeric" data-i18n-placeholder="latest">
            <div class="date-list" id="dates-when" hidden></div>
          </div>
        </div>
        <div class="fields two" id="fields-change" hidden>
          <div class="field">
            <div class="field-head"><label for="before" data-i18n="before"></label>
              <button type="button" class="text-button" data-dates="before" aria-expanded="false" aria-controls="dates-before" data-i18n="datesButton"></button></div>
            <input id="before" type="text" inputmode="numeric" value="2016">
            <div class="date-list" id="dates-before" hidden></div>
          </div>
          <div class="field">
            <div class="field-head"><label for="after" data-i18n="after"></label>
              <button type="button" class="text-button" data-dates="after" aria-expanded="false" aria-controls="dates-after" data-i18n="datesButton"></button></div>
            <input id="after" type="text" inputmode="numeric">
            <div class="date-list" id="dates-after" hidden></div>
          </div>
        </div>
        <div class="fields two" id="fields-time" hidden>
          <div class="field">
            <div class="field-head"><label for="start" data-i18n="startYear"></label></div>
            <input id="start" type="text" inputmode="numeric" maxlength="4" value="2016">
          </div>
          <div class="field">
            <div class="field-head"><label for="end" data-i18n="endYear"></label></div>
            <input id="end" type="text" inputmode="numeric" maxlength="4">
          </div>
        </div>
        <p class="hint" id="date-help" data-i18n="dateHelp"></p>

        <div class="row">
          <div>
            <span class="label" data-i18n="cell"></span>
            <div class="segmented small" id="cell">
              <button type="button" data-cell="320" aria-selected="false">320 m</button>
              <button type="button" data-cell="640" aria-selected="true">640 m</button>
              <button type="button" data-cell="1280" aria-selected="false">1.3 km</button>
            </div>
          </div>
          <label class="size"><span data-i18n="area"></span>
            <select id="size" class="pill-select">
              <option value="10">10 km</option><option value="15">15 km</option>
              <option value="20" selected>20 km</option><option value="25">25 km</option>
            </select>
          </label>
        </div>

        <button class="pill-button primary" id="run" type="submit"></button>
        </div>
        <div class="status-row" id="status-row" hidden>
          <p class="status" id="status" role="status" hidden></p>
          <button class="pill-button small" id="cancel" type="button" data-i18n="cancel" hidden></button>
        </div>
      </form>
    </section>

    <section class="card results" id="results" hidden aria-live="polite"></section>
  </main>

  <button class="scroll-cue" type="button" data-scroll="examples" data-i18n="sectionsCue"></button>

  <!-- Below the map: always-open sections, filled from the data files by app.js. -->
  <div class="sections">
    <section class="section" id="examples" aria-labelledby="examples-title">
      <h2 id="examples-title" data-i18n="examplesTitle"></h2>
      <div class="section-body" id="examples-body"></div>
    </section>
    <section class="section" id="rankings" aria-labelledby="rankings-title">
      <h2 id="rankings-title" data-i18n="rankingsTitle"></h2>
      <div class="section-body" id="rankings-body"></div>
    </section>
    <section class="section" id="about" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="aboutTitle"></h2>
      <div class="section-body" id="about-body"></div>
    </section>
  </div>

  <footer class="credit"><span data-i18n="credit"></span></footer>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
